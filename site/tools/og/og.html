<!DOCTYPE html>
<!-- The social card (og.jpg). tools/og.mjs renders this page at 1200×630 with
     headless Chrome. Night palette from css/style.css, the hero photo in a
     stack card, the wordmark in the site's own pixel fonts. -->
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>OpenWalkieTalkie social card</title>
<style>
@font-face { font-family: "Press Start 2P"; src: url("../../public/fonts/press-start-2p-latin.woff2") format("woff2"); }
@font-face { font-family: "VT323"; src: url("../../public/fonts/vt323-latin.woff2") format("woff2"); }
html, body { margin: 0; }
body {
  position: relative; width: 1200px; height: 630px; overflow: hidden;
  background: linear-gradient(180deg, #101637 0%, #1b2450 52%, #2b3670 100%);
  color: #e7edff; font-family: "VT323", monospace;
}
.star { position: absolute; width: 4px; height: 4px; background: #dfe6ff; opacity: .7; }
.hill { position: absolute; left: -40px; right: -40px; bottom: -60px; height: 150px; border-radius: 50% 50% 0 0 / 100% 100% 0 0; }
.hill--back { background: #24413a; bottom: -40px; height: 140px; left: 300px; right: -300px; opacity: .9; }
.hill--front { background: #3c6a58; }
.card {
  position: absolute; left: 76px; top: 46px; width: 384px; padding: 12px 12px 0;
  background: #2b3568; transform: rotate(-2.4deg);
  box-shadow: 0 0 0 4px #0c1024, 8px 10px 0 0 rgba(0,0,0,.45);
}
.card img { display: block; width: 100%; height: auto; }
.card figcaption {
  font-family: "Press Start 2P", monospace; font-size: 9px; letter-spacing: .16em;
  color: #ffd977; padding: 12px 2px 14px;
}
.copy { position: absolute; left: 556px; top: 96px; width: 600px; }
.eyebrow { font-family: "Press Start 2P", monospace; font-size: 11px; letter-spacing: .18em; color: #8b97cc; margin: 0 0 30px; }
h1 { font-family: "Press Start 2P", monospace; font-size: 46px; line-height: 1.3; margin: 0 0 28px; color: #e7edff; font-weight: normal; }
h1 b { color: #ffd977; font-weight: normal; }
.tag { font-size: 38px; line-height: 1.15; margin: 0; color: #e7edff; max-width: 15ch; }
.rule { position: absolute; left: 556px; bottom: 104px; width: 320px; height: 6px; background: #ffd977; }
.url { position: absolute; left: 556px; bottom: 60px; font-family: "Press Start 2P", monospace; font-size: 12px; letter-spacing: .14em; color: #b9c4ee; margin: 0; }
</style>
</head>
<body>
<span class="star" style="left:540px;top:40px"></span>
<span class="star" style="left:1120px;top:70px"></span>
<span class="star" style="left:980px;top:30px;opacity:.4"></span>
<span class="star" style="left:1160px;top:300px;opacity:.5"></span>
<span class="star" style="left:30px;top:600px;opacity:.5"></span>
<span class="hill hill--back"></span>
<span class="hill hill--front"></span>
<figure class="card">
  <img src="../../public/assets/photos/hero-pair.webp" alt="" width="1045" height="1306" />
  <figcaption>TWO COLOURWAYS · ONE DECK</figcaption>
</figure>
<div class="copy">
  <p class="eyebrow">OPEN HARDWARE · OPEN FIRMWARE · OPEN HOST</p>
  <h1>OPEN WALKIE<br /><b>TALKIE</b></h1>
  <p class="tag">The open-source handheld radio for your AI agents.</p>
</div>
<span class="rule"></span>
<p class="url">OPENWALKIETALKIE.ORG</p>
</body>
</html>
