name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_call:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
defaults:
  run:
    shell: bash
env:
  CARGO_TERM_COLOR: always
jobs:
  firmware:
    name: Firmware (${{ matrix.board }})
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        board: [lilygo, hw-a, hw-b]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30
        with:
          toolchain: 1.98.1
          targets: thumbv8m.main-none-eabihf
      - name: Test the shared firmware and renderer
        env:
          BOARD: ${{ matrix.board }}
        run: |
          set -euo pipefail
          features=()
          if [[ "$BOARD" != lilygo ]]; then features=(--features "$BOARD"); fi
          host=$(rustc -vV | sed -n 's/^host: //p')
          cargo test --manifest-path tests/host/Cargo.toml --locked --target "$host" --target-dir target/host-tests "${features[@]}"
          cargo test --manifest-path native/core/Cargo.toml --lib --locked --target "$host" --target-dir target/native-tests "${features[@]}"
          cc -std=c11 -Wall -Wextra -Werror tests/panel.c -o /tmp/panel-test
          /tmp/panel-test
          cc -std=c11 -Wall -Wextra -Werror tests/speaker_pcm.c -o /tmp/speaker-test
          /tmp/speaker-test
          python3 -m unittest discover -s tools/tests -p 'test_*.py'
      - name: Build firmware
        env:
          BOARD: ${{ matrix.board }}
        run: |
          if [[ "$BOARD" == lilygo ]]; then
            cargo build --release --locked --target thumbv8m.main-none-eabihf
          fi
      - name: Check out the pinned recovery SDK
        if: matrix.board != 'lilygo'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: OpenSiFli/SiFli-SDK
          ref: 006d03293e0621d694335cd4031773279fa2f19a
          path: target/sifli-sdk
          submodules: recursive
          persist-credentials: false
      - name: Build production, migration, and recovery images
        if: matrix.board != 'lilygo'
        env:
          BOARD: ${{ matrix.board }}
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends gcc-arm-none-eabi binutils-arm-none-eabi libnewlib-arm-none-eabi python3-venv
          python3 -m venv target/recovery-build-env
          source target/recovery-build-env/bin/activate
          pip install -r target/sifli-sdk/tools/requirements/requirements.core.txt
          export SIFLI_SDK="$PWD/target/sifli-sdk"
          export SIFLI_SDK_PATH="$SIFLI_SDK"
          export PYTHONPATH="$SIFLI_SDK/tools/build"
          export RTT_CC=gcc RTT_EXEC_PATH=/usr/bin SIFLI_SF_PKG_OFFLINE=1
          bash tools/build-firmware-release.sh "$BOARD" dist/firmware
          if [[ "$BOARD" == hw-a ]]; then
            python3 "$SIFLI_SDK/tools/build/gen_ftab.py" \
              --ptab native/boards/openwalkietalkie/ptab.yaml \
              --output target/factory-ftab.bin --bootloader-size 0x10000 --main-size 0x6E0000
          fi
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: matrix.board == 'hw-a'
        with:
          name: factory-ftab
          path: target/factory-ftab.bin
          if-no-files-found: error
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: matrix.board != 'lilygo'
        with:
          name: firmware-${{ matrix.board }}
          path: dist/firmware/*
          if-no-files-found: error
  host:
    name: macOS host
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30
        with:
          toolchain: 1.98.1
          components: clippy
      - name: Test the host and app
        run: |
          cargo test --manifest-path host/Cargo.toml --workspace --lib --tests --locked --target aarch64-apple-darwin --target-dir target/host
      - name: Lint the host and app
        run: |
          cargo clippy --manifest-path host/Cargo.toml -p deckd -p deck-model -p deck-gui-core -p openwalkietalkie-app --all-targets --locked --target aarch64-apple-darwin --target-dir target/host -- -D warnings
      - name: Check the updater bridge
        run: |
          tools/fetch-sparkle.sh target/sparkle/2.9.6
          OWT_SPARKLE_FRAMEWORK_DIR="$PWD/target/sparkle/2.9.6" cargo check --manifest-path host/Cargo.toml -p openwalkietalkie-app --locked --target aarch64-apple-darwin --target-dir target/host
  linux-host:
    name: Linux host
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30
        with:
          toolchain: 1.98.1
      # hidapi's hidraw backend links libudev; cpal's ALSA backend and bluer's
      # D-Bus client find their libraries through pkg-config; whisper-rs builds
      # whisper.cpp with CMake and generates its bindings with libclang. The
      # service's tests name a port's squatter with lsof.
      - name: Install the Linux host's system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends pkg-config libudev-dev libasound2-dev libdbus-1-dev cmake libclang-dev lsof
      # The window is macOS only, so the app is left out. The repository's
      # .cargo/config.toml builds for the firmware, hence the explicit target.
      - name: Test the Linux host
        run: |
          cargo test --manifest-path host/Cargo.toml --workspace --exclude openwalkietalkie-app --lib --tests --locked --target x86_64-unknown-linux-gnu --target-dir target/host
      - name: Test the Omarchy bridge
        run: |
          python3 -m unittest discover -s host/omarchy -p 'test_*.py'
